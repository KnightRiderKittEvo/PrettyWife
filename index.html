<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <title>一生摯愛｜每一刻，都是喜歡你的理由</title>
  <meta name="description" content="把喜歡的日常，收藏成一輯照片。美麗老婆特輯。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="美麗老婆特輯">
  <meta property="og:description" content="每一刻，都是喜歡你的理由。">
  <meta property="og:image" content="og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3ed;
      --ink: #28231f;
      --muted: #82786f;
      --accent: #a15f52;
      --line: #e5ddd3;
      --serif: "Iowan Old Style", "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      --sans: "Aptos", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .page { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
    .masthead { padding: 48px 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { color: var(--ink); text-decoration: none; font-family: var(--serif); font-size: 19px; letter-spacing: .08em; }
    .brand-mark { color: var(--accent); margin-right: 9px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; padding: 40px 0 25px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--serif); font-size: clamp(34px, 5vw, 55px); font-weight: 500; letter-spacing: .045em; line-height: 1.2; }
    .subtitle { margin: 14px 0 0; color: var(--muted); font-family: var(--serif); font-size: 16px; letter-spacing: .04em; }
    .photo-count { color: var(--muted); font-family: var(--serif); font-size: 13px; letter-spacing: .08em; padding-bottom: 5px; white-space: nowrap; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; padding: 13px 0 54px; }
    .tile { appearance: none; display: block; overflow: hidden; position: relative; padding: 0; border: 0; background: #e9e2d9; cursor: zoom-in; aspect-ratio: 4 / 5; }
    .tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .65s cubic-bezier(.2,.7,.2,1), filter .35s ease; }
    .tile img.landscape { object-fit: contain; background: #e9e2d9; }
    .tile:hover img, .tile:focus-visible img { transform: scale(1.035); filter: saturate(.94); }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .tile-number { position: absolute; left: 13px; bottom: 12px; color: #fff; font-family: var(--serif); font-size: 12px; letter-spacing: .12em; text-shadow: 0 1px 8px #0008; }
    .footer { display: flex; justify-content: space-between; padding: 20px 0 36px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .1em; }
    .lightbox { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: rgba(20, 18, 18, .96); color: #fff; padding: 50px 86px 62px; }
    .lightbox.open { display: grid; }
    .lightbox figure { display: grid; place-items: center; overflow: hidden; width: 100%; height: 100%; margin: 0; min-height: 0; }
    .lightbox-photo { display: block; flex: none; max-width: none; max-height: none; object-fit: contain; user-select: none; -webkit-user-drag: none; will-change: width, height, transform; }
    .lightbox-caption { position: absolute; bottom: 22px; left: 0; width: 100%; color: #d9d2cc; text-align: center; font-family: var(--serif); font-size: 13px; letter-spacing: .14em; }
    .control { appearance: none; position: absolute; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 1px solid #ffffff55; border-radius: 50%; background: #ffffff0c; color: #fff; font-size: 25px; line-height: 1; cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .control:hover { background: #ffffff24; border-color: #ffffffa0; }
    .control:focus-visible { outline: 2px solid #e7c697; outline-offset: 3px; }
    .close { top: 22px; right: 24px; font-size: 22px; }
    .previous { left: 24px; top: 50%; transform: translateY(-50%); }
    .next { right: 24px; top: 50%; transform: translateY(-50%); }
    body.locked { overflow: hidden; }
    @media (max-width: 700px) {
      .page { width: min(100% - 28px, 560px); }
      .masthead { padding: 27px 0 20px; }
      .edition { font-size: 9px; }
      .intro { padding: 30px 0 17px; }
      .gallery { gap: 8px; padding-top: 8px; }
      .tile-number { left: 7px; bottom: 7px; font-size: 10px; }
      .lightbox { padding: 54px 8px 62px; }
      .control { width: 40px; height: 40px; background: #1118; }
      .close { top: 12px; right: 12px; }
      .previous { left: 8px; }
      .next { right: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="#top"><span class="brand-mark">✳</span>美麗老婆特輯</a>
      <span class="edition">A little album of you</span>
    </header>
    <main id="top">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">My favorite women in my life</p>
          <h1 id="page-title">美麗老婆特輯</h1>
          <p class="subtitle">每一刻，都是喜歡你的理由。</p>
        </div>
        <span class="photo-count"><span id="count">15</span> 張珍藏</span>
      </section>
      <section class="gallery" id="gallery" aria-label="老婆的照片集"></section>
    </main>
    <footer class="footer"><span>MADE WITH LOVE</span><span>只想把美好，好好收藏。</span></footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片瀏覽器" aria-hidden="true">
    <button class="control close" id="close" type="button" aria-label="關閉照片">×</button>
    <button class="control previous" id="previous" type="button" aria-label="上一張">‹</button>
    <figure><img class="lightbox-photo" id="lightbox-photo" alt="" draggable="false"><figcaption class="lightbox-caption" id="caption"></figcaption></figure>
    <button class="control next" id="next" type="button" aria-label="下一張">›</button>
  </div>

  <script>
    const photos = [
      "IMG_20240328_120536.jpg",
      "IMG_20240303_104118.jpg",
      "IMG_20231230_082124.jpg",
      "IMG_20231231_102758.jpg",
      "IMG_20231231_153938.jpg",
      "IMG_20240114_143256.jpg",
      "IMG_20240127_144427.jpg",
      "IMG_20240203_121721.jpg",
      "IMG_20240203_122243.jpg",
      "IMG_20240203_180228.jpg",
      "IMG_20240204_102250.jpg",
      "IMG_20240204_103233.jpg",
      "IMG_20240204_123605.jpg",
      "IMG_20240204_123624.jpg",
      "IMG_20240212_133734.jpg"
    ];
    const gallery = document.getElementById("gallery");
    const box = document.getElementById("lightbox");
    const largePhoto = document.getElementById("lightbox-photo");
    const caption = document.getElementById("caption");
    let current = 0;
    let returnFocus = null;
    let touchStartX = null;
    let zoom = 1;
    let maxZoom = 1;
    let baseWidth = 0;
    let baseHeight = 0;
    let offsetX = 0;
    let offsetY = 0;
    let drag = null;

    document.getElementById("count").textContent = photos.length;
    photos.forEach((name, index) => {
      const button = document.createElement("button");
      button.className = "tile";
      button.type = "button";
      button.setAttribute("aria-label", `放大第 ${index + 1} 張照片`);
      const image = document.createElement("img");
      image.src = `gallery-thumbs/${name}`;
      image.alt = `老婆的照片，第 ${index + 1} 張`;
      image.loading = index < 9 ? "eager" : "lazy";
      image.decoding = "async";
      image.addEventListener("load", () => {
        if (image.naturalWidth > image.naturalHeight) image.classList.add("landscape");
      }, { once: true });
      const number = document.createElement("span");
      number.className = "tile-number";
      number.textContent = String(index + 1).padStart(2, "0");
      button.append(image, number);
      button.addEventListener("click", () => openAt(index, button));
      gallery.append(button);
    });

    function showPhoto() {
      const name = photos[current];
      largePhoto.onload = resetPhotoView;
      largePhoto.src = name;
      largePhoto.alt = `老婆的照片，第 ${current + 1} 張，共 ${photos.length} 張`;
      caption.textContent = `${String(current + 1).padStart(2, "0")}　/　${String(photos.length).padStart(2, "0")}`;
    }
    function resetPhotoView() {
      if (!largePhoto.naturalWidth || !largePhoto.naturalHeight) return;
      const stage = largePhoto.parentElement.getBoundingClientRect();
      if (!stage.width || !stage.height) {
        requestAnimationFrame(resetPhotoView);
        return;
      }
      const fit = Math.min((stage.width - 12) / largePhoto.naturalWidth, (stage.height - 12) / largePhoto.naturalHeight, 1);
      baseWidth = largePhoto.naturalWidth * fit;
      baseHeight = largePhoto.naturalHeight * fit;
      maxZoom = Math.max(1, 1 / fit);
      zoom = 1;
      offsetX = 0;
      offsetY = 0;
      applyPhotoView();
    }
    function clampOffset() {
      const stage = largePhoto.parentElement.getBoundingClientRect();
      const maxX = Math.max(0, (baseWidth * zoom - stage.width) / 2);
      const maxY = Math.max(0, (baseHeight * zoom - stage.height) / 2);
      offsetX = Math.max(-maxX, Math.min(maxX, offsetX));
      offsetY = Math.max(-maxY, Math.min(maxY, offsetY));
    }
    function applyPhotoView() {
      clampOffset();
      largePhoto.style.width = `${baseWidth * zoom}px`;
      largePhoto.style.height = `${baseHeight * zoom}px`;
      largePhoto.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0)`;
      largePhoto.style.cursor = zoom > 1.001 ? (drag ? "grabbing" : "grab") : "zoom-in";
    }
    function openAt(index, source) {
      current = index;
      returnFocus = source;
      box.classList.add("open");
      box.setAttribute("aria-hidden", "false");
      document.body.classList.add("locked");
      showPhoto();
      document.getElementById("close").focus();
    }
    function closeBox() {
      box.classList.remove("open");
      box.setAttribute("aria-hidden", "true");
      document.body.classList.remove("locked");
      largePhoto.removeAttribute("src");
      largePhoto.style.width = "";
      largePhoto.style.height = "";
      largePhoto.style.transform = "";
      zoom = 1;
      offsetX = 0;
      offsetY = 0;
      returnFocus?.focus();
    }
    function step(amount) {
      current = (current + amount + photos.length) % photos.length;
      showPhoto();
    }
    document.getElementById("close").addEventListener("click", closeBox);
    document.getElementById("previous").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    box.addEventListener("click", event => { if (event.target === box) closeBox(); });
    box.addEventListener("wheel", event => {
      if (!box.classList.contains("open") || !baseWidth) return;
      event.preventDefault();
      const stage = largePhoto.parentElement.getBoundingClientRect();
      const pointerX = event.clientX - (stage.left + stage.width / 2);
      const pointerY = event.clientY - (stage.top + stage.height / 2);
      const oldZoom = zoom;
      zoom = Math.max(1, Math.min(maxZoom, zoom * Math.exp(-event.deltaY * 0.0015)));
      const ratio = zoom / oldZoom;
      offsetX = pointerX - (pointerX - offsetX) * ratio;
      offsetY = pointerY - (pointerY - offsetY) * ratio;
      applyPhotoView();
    }, { passive: false });
    largePhoto.addEventListener("pointerdown", event => {
      if (zoom <= 1.001 || event.button !== 0) return;
      event.preventDefault();
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY, offsetX, offsetY };
      largePhoto.setPointerCapture(event.pointerId);
      applyPhotoView();
    });
    largePhoto.addEventListener("pointermove", event => {
      if (!drag || drag.id !== event.pointerId) return;
      offsetX = drag.offsetX + event.clientX - drag.x;
      offsetY = drag.offsetY + event.clientY - drag.y;
      applyPhotoView();
    });
    function endDrag(event) {
      if (!drag || drag.id !== event.pointerId) return;
      drag = null;
      applyPhotoView();
    }
    largePhoto.addEventListener("pointerup", endDrag);
    largePhoto.addEventListener("pointercancel", endDrag);
    window.addEventListener("resize", () => {
      if (box.classList.contains("open") && largePhoto.complete) resetPhotoView();
    });
    document.addEventListener("keydown", event => {
      if (!box.classList.contains("open")) return;
      if (event.key === "Escape") closeBox();
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
    });
    box.addEventListener("touchstart", event => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
    box.addEventListener("touchend", event => {
      if (zoom > 1.001) { touchStartX = null; return; }
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 50) step(delta > 0 ? -1 : 1);
      touchStartX = null;
    }, { passive: true });
  </script>
</body>
</html>
